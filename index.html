<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRONHOLLOW</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<pre id="debug" hidden></pre>
<div id="msg"></div>
<div id="hud">
  <span>HP <b id="hp">100</b></span>
  <span>БРОНЯ <b id="ar">0</b></span>
  <span>ПУЛИ <b id="bu">0</b></span>
  <span>ДРОБЬ <b id="sh">0</b></span>
  <span class="key r" id="k1">R</span><span class="key b" id="k2">B</span><span class="key y" id="k3">Y</span>
</div>
<div id="overlay">
  <h1>IRONHOLLOW</h1>
  <p class="hint">Нажмите, чтобы начать</p>
  <p class="keys">WASD — движение · Shift — бег · Мышь / стрелки — поворот · E / Пробел — открыть<br>
  Esc — пауза · F3 — отладка · F4 — разрешение 320×200 / 640×400</p>
</div>

<!-- Порядок важен: без ES-модулей, общий namespace GAME -->
<script src="js/config.js"></script>
<script src="js/input.js"></script>
<script src="js/textures.js"></script>
<script src="js/sprites.js"></script>
<script src="js/levels.js"></script>
<script src="js/map.js"></script>
<script src="js/items.js"></script>
<script src="js/player.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
</body>
</html>
