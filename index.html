<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IRONHOLLOW</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<pre id="debug" hidden></pre>
<div id="fps" hidden></div>
<div id="msg"></div>
<div id="status"></div>
<div id="endscreen" hidden></div>
<div id="overlay"></div>

<!-- Сенсорное управление (показывается на телефонах во время игры) -->
<div id="touch">
  <div class="zone" id="tz-move"></div>
  <div class="zone" id="tz-look"></div>
  <div id="t-base" hidden></div><div id="t-knob" hidden></div>
  <button class="btn" id="t-fire">ОГОНЬ</button>
  <button class="btn" id="t-use">E</button>
  <button class="btn small" id="t-prev">◀</button>
  <button class="btn small" id="t-next">▶</button>
  <button class="btn small" id="t-map">КАРТА</button>
  <button class="btn small" id="t-pause">❚❚</button>
</div>
<div id="rotate">Поверните телефон горизонтально</div>

<!-- Порядок важен: без ES-модулей, общий namespace GAME -->
<script src="js/config.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/textures.js"></script>
<script src="js/sprites.js"></script>
<script src="js/levels.js"></script>
<script src="js/map.js"></script>
<script src="js/items.js"></script>
<script src="js/enemies.js"></script>
<script src="js/projectiles.js"></script>
<script src="js/player.js"></script>
<script src="js/hud.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
